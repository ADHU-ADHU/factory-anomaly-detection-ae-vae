<title>Variational autoencoder architecture for assembly anomaly detection</title>
<desc>A feature encoder produces 512-dimensional posterior mean and log variance. Reparameterization samples latent vectors for decoder training. Deterministic inspection uses posterior means for Mahalanobis or Gaussian mixture model scoring.</desc>
