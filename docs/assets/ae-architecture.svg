<title>Autoencoder architecture for assembly anomaly detection</title>
<desc>RGB input passes through a CNN or frozen backbone encoder, a 512-dimensional bottleneck and a shared convolutional decoder. Training minimizes reconstruction error. Inspection uses reconstruction or latent-space anomaly scores.</desc>
