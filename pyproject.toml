[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-anomaly-detection"
version = "0.1.0"
description = "TensorFlow AE and VAE reference adapters for industrial visual anomaly detection"
requires-python = ">=3.10,<3.13"
dependencies = [
  "tensorflow-cpu==2.16.2; platform_system != 'Darwin'",
  "tensorflow==2.16.2; platform_system == 'Darwin'",
  "keras==3.15.1",
  "numpy>=1.26,<2",
  "scikit-learn==1.5.2",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "nbformat==5.10.4"]

[project.scripts]
factory-anomaly = "factory_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
